[project]
name = "attendance-analyser"
version = "0.1.0"
description = "Reactive Marimo notebook for weekly event attendance analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "marimo>=0.9.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "polars>=1.9.0",
    "pyarrow>=17.0.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["attendance_logic"]

[tool.uv]
package = true
